name: Deploy Release
on:
  release:
    types:
      - published
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm install
      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PUBLISHER_TOKEN: ${{ secrets.VSCE_PUBLISHER_TOKEN }}
        run: |
          if [ -z "$VSCE_PUBLISHER_TOKEN" ]; then
            echo "VSCE_PUBLISHER_TOKEN secret is not set; skipping Marketplace publish."
            exit 1
          fi
          npm run vsce-publish -- -p "$VSCE_PUBLISHER_TOKEN"
