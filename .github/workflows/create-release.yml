name: Create Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm install && mkdir -p ./bin
      - run: npm run vsce-package
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: ./bin/theme.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Publish in the same job: releases created with GITHUB_TOKEN do not
      # trigger separate workflows on `release: published`.
      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PUBLISHER_TOKEN: ${{ secrets.VSCE_PUBLISHER_TOKEN }}
        run: |
          if [ -z "$VSCE_PUBLISHER_TOKEN" ]; then
            echo "::error::VSCE_PUBLISHER_TOKEN secret is not set on this repository."
            echo "Add the same publisher token used by vscode-new-ui-dark-theme, then re-run this job."
            exit 1
          fi
          npm run vsce-publish -- -p "$VSCE_PUBLISHER_TOKEN"
